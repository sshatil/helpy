name: Release Desktop

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc

          # macOS Apple Silicon
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      # Resolve release tag
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected format: v1.2.3"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # Setup Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache Rust
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target

      # Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Validate production environment
      - name: Validate production environment
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "Missing VITE_SUPABASE_URL GitHub secret."
            exit 1
          fi

          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing VITE_SUPABASE_PUBLISHABLE_KEY GitHub secret."
            exit 1
          fi

          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY GitHub secret."
            exit 1
          fi

          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD GitHub secret."
            exit 1
          fi

      # Build and create GitHub release
      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          projectPath: apps/desktop

          # Release information
          tagName: ${{ steps.release.outputs.tag }}

          releaseName: Helpy ${{ steps.release.outputs.tag }}

          releaseBody: |
            ## Helpy ${{ steps.release.outputs.tag }}

            Production desktop release of Helpy.

            ### Platforms

            - Windows x64
            - macOS Apple Silicon

            ### Installation

            Download the installer for your platform from the assets below.

          # Release settings
          releaseDraft: true
          prerelease: false

          # section based on commits and pull requests.
          generateReleaseNotes: true

          # Tauri build
          args: --target ${{ matrix.target }}

          # Tauri updater
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

          # Retry failed uploads/build release operations.
          retryAttempts: 2
