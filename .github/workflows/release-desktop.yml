name: Release Desktop

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc

          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      # Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Rust cache
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target

      # Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Validate production environment
      - name: Validate production environment
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "Missing VITE_SUPABASE_URL GitHub secret."
            exit 1
          fi

          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing VITE_SUPABASE_PUBLISHABLE_KEY GitHub secret."
            exit 1
          fi

      # Build and publish GitHub Release
      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

        with:
          projectPath: apps/desktop

          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

          releaseName: 'helpy ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}'

          releaseBody: |
            ## helpy ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

            Production desktop release of helpy.

            ### Platforms

            - Windows x64
            - macOS Apple Silicon

            ### Installation

            Download the installer for your platform from the assets below.

          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true

          args: '--target ${{ matrix.target }}'

          retryAttempts: 2